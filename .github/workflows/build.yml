name: Build & Test

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Shared Config
        run: |
          node scripts/sync-config.mjs --check
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=$(node scripts/sync-config.mjs --get version)
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match app.config.json version $VERSION"
              exit 1
            fi
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build & Test Go Core
        run: make -C core build && make -C core test

      - name: Install Frontend Dependencies
        run: npm --prefix app ci

      - name: Shared Config Tests
        run: npm run test:config

      - name: Frontend Typecheck & Build
        run: npm --prefix app run build

      - name: Frontend API Tests
        run: node --test app/tests/*.test.mjs

      - name: Build macOS App
        run: make -C native/macos build

      - name: Swift Tests
        run: make -C native/macos test

      - name: Package macOS App (DMG & ZIP)
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            PKG_VER=$(node scripts/sync-config.mjs --get version)
            VERSION="v${PKG_VER#v}"
          fi
          APP_NAME=$(node scripts/sync-config.mjs --get name)
          echo "Packaging $APP_NAME version: $VERSION"
          cd native/macos
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_NAME.app" -ov -format UDZO "$APP_NAME-${VERSION}-macOS.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME.app" "$APP_NAME-${VERSION}-macOS.zip"
          ls -lh "$APP_NAME"-*-macOS.*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClefVoice-macOS
          path: |
            native/macos/*-macOS.dmg
            native/macos/*-macOS.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "ClefVoice ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            native/macos/*-macOS.dmg
            native/macos/*-macOS.zip

